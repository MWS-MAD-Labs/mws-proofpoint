services:
  # ============================================
  # Next.js Application (Frontend + API)
  # ============================================
  app:
    image: ghcr.io/mws-mad-labs/mws-proofpoint:${PROOFPOINT_IMAGE_TAG:-latest}
    # To build locally instead, comment out 'image' and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: proofpoint-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-proofpoint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-proofpoint}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-proofpoint}
      POSTGRES_USER: ${POSTGRES_USER:-proofpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://proof.mws.web.id}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_TRUST_HOST: "true"
      PROOFPOINT_AUTH_MODE: ${PROOFPOINT_AUTH_MODE:-nextauth}
      HUB_BASE_URL: ${HUB_BASE_URL:-https://app.mws.web.id}
      HUB_SSO_APP_ID: ${HUB_SSO_APP_ID:-proofpoint}
      HUB_ACCESS_AUDIENCE: ${HUB_ACCESS_AUDIENCE:-mws-apps}
      HUB_ACCESS_COOKIE_NAME: ${HUB_ACCESS_COOKIE_NAME:-}
      CENTRAL_API_BASE_URL: ${CENTRAL_API_BASE_URL:-https://db.mws.web.id/api/internal}
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN:-}
      CENTRAL_ORGANIZATION_ID: ${CENTRAL_ORGANIZATION_ID:-}
      PROOFPOINT_CENTRAL_ACCESS_CACHE_SECONDS: ${PROOFPOINT_CENTRAL_ACCESS_CACHE_SECONDS:-30}
      # Google Auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidence}
      # Email
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_DEBUG: ${EMAIL_DEBUG:-false}
      EMAIL_SERVICE: ${EMAIL_SERVICE:-nodemailer}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@proofpoint.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ProofPoint Dashboard}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "3060:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3


  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: proofpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-proofpoint}
      POSTGRES_USER: ${POSTGRES_USER:-proofpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofpoint}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO S3-Compatible Storage
  # ============================================
  minio:
    # Use the explicit Quay image/tag already used by the production stack.
    # The unqualified `minio/minio` reference fails to pull on the Komodo host.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: proofpoint-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
  minio-data:
